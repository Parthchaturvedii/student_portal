<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<nav>
    <div class="logo">STUdentClasses - Admin</div>
</nav>

<div class="personal">
    <h1>All Registered Students</h1>

    <table border="1" id="studentTable">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Class</th>
            <th>Email</th>
        </tr>
    </table>

    <br>
    <button onclick="logoutAdmin()">Logout</button>
</div>

<script>

// Protect Admin Route
if(localStorage.getItem("isAdmin") !== "true"){
    alert("Admin access only!");
    window.location.href = "login.html";
}

let users = JSON.parse(localStorage.getItem("users")) || [];
let table = document.getElementById("studentTable");

// Render Table Function
function renderTable(){
    table.innerHTML = `
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Class</th>
            <th>Email</th>
            <th>Action</th>
        </tr>
    `;

    users.forEach((user, index) => {
        let row = table.insertRow();
        row.insertCell(0).innerText = user.name;
        row.insertCell(1).innerText = user.age;
        row.insertCell(2).innerText = user.studentClass;
        row.insertCell(3).innerText = user.email;

        let deleteBtn = document.createElement("button");
        deleteBtn.innerText = "Delete";
        deleteBtn.onclick = function(){
            deleteUser(index);
        };

        row.insertCell(4).appendChild(deleteBtn);
    });
}

function deleteUser(index){
    if(confirm("Are you sure you want to delete this student?")){
        users.splice(index,1);
        localStorage.setItem("users", JSON.stringify(users));
        renderTable();
    }
}

function logoutAdmin(){
    localStorage.removeItem("isAdmin");
    window.location.href = "login.html";
}

renderTable();

</script>

</body>
</html>
