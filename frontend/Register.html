<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="Register.css">
</head>
<body>
     <nav>
            <div class="logo">STUdentClasses</div>
    </nav>

    <div class="reg">
        <p>Name</p>
        <input id="name" type="text" placeholder="eg. Parth Chaturvedi" required>
        <p>Age</p>
        <input type="number" id="age" placeholder="eg. 19" required>
        <p>class</p>
        <input type="number" id="class" placeholder="eg. 12th" required>
        <p>Email</p>
        <input type="email" id="email" placeholder="Enter Email" required>
        <p>password</p>
        <input type="password" id="password" placeholder="Enter password" required>
        <br>
        <button onclick="registerUser()">Register</button>
    </div>

    <script src="Register.js"></script>
</body>
</html>
